<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- 白底（完全参考指定 logo 的版式与配色） -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- 左侧：双色块「英语」logo（favicon.svg 同款几何，放大 1.45 倍） -->
  <g transform="translate(30,68) scale(1.45)">
    <polygon points="185,64 281,64 265,264 169,264" fill="#003366"/>
    <polygon points="244,112 348,112 330,340 226,340" fill="#00CCCC"/>
    <text x="214" y="222" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" text-anchor="middle">英</text>
    <text x="300" y="220" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" text-anchor="middle">语</text>
    <text x="264" y="84" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#00CCCC" letter-spacing="0.5">Ying</text>
    <text x="264" y="108" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#00CCCC" letter-spacing="0.5">Yu</text>
  </g>

  <!-- 右侧 wordmark -->
  <text x="620" y="238" font-family="Arial,Helvetica,sans-serif" font-size="60" font-weight="800" fill="#003366" letter-spacing="2">ENGLISHHEFT</text>
  <rect x="624" y="264" width="190" height="5" rx="2.5" fill="#00CCCC"/>
  <text x="624" y="324" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="28" fill="#5A6572">Jian (Jack) Wu &#183; 15000 英语单词口袋书</text>
  <text x="624" y="376" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#00CCCC">7,052 words &#183; 4,941 sentences &#183; 51 phonemes</text>

  <!-- jwlab 出品方署名（右下角，低调） -->
  <circle cx="1074" cy="588" r="4" fill="#00CCCC"/>
  <text x="1150" y="596" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic" fill="#003366" fill-opacity="0.55" text-anchor="end">jwlab</text>
</svg>
