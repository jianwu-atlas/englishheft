<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 完全参考 Jian 指定的双色块 logo（500×500 源图，取色 #003366 / #00CCCC） -->
  <!-- 左：深海军蓝平行色块 -->
  <polygon points="185,64 281,64 265,264 169,264" fill="#003366"/>
  <!-- 右：青绿色平行色块（更宽、下移；顶部被拼音文字压住，呈「文字下切入块」形制） -->
  <polygon points="244,112 348,112 330,340 226,340" fill="#00CCCC"/>
  <!-- 白色「英语」二字：跨两色块，左块承「英」，右块承「语」 -->
  <text x="214" y="222" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" text-anchor="middle">英</text>
  <text x="300" y="220" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" text-anchor="middle">语</text>
  <!-- 青绿拼音 Ying Yu：右上角，两行，底边切入右块顶部 -->
  <text x="264" y="84" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#00CCCC" letter-spacing="0.5">Ying</text>
  <text x="264" y="108" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#00CCCC" letter-spacing="0.5">Yu</text>
</svg>
