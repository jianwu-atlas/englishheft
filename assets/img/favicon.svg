<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 墨黑圆角方块：与德语站同一枚印章几何 -->
  <rect x="0" y="0" width="512" height="512" rx="118" fill="#201B14"/>
  <!-- 极细内框：手工压印的边界感 -->
  <rect x="24" y="24" width="464" height="464" rx="98" fill="none" stroke="#C9A227" stroke-opacity="0.16" stroke-width="2"/>
  <!-- 主字母 E：Englishheft -->
  <text x="256" y="288" font-family="Georgia, 'Times New Roman', serif" font-size="248" font-weight="700" fill="#C9A227" text-anchor="middle">E</text>
  <!-- 单一细金线：比字母更短，克制收束 -->
  <rect x="196" y="314" width="120" height="6" rx="3" fill="#C9A227"/>
  <!-- 三点：jwlab 系列印记（与德语站同色，保持家族识别） -->
  <circle cx="210" cy="364" r="15" fill="#2456A6"/>
  <circle cx="256" cy="364" r="15" fill="#B03048"/>
  <circle cx="302" cy="364" r="15" fill="#2E7D5B"/>
  <!-- 第四点：Englishheft 独有的书本蓝色（取自原书强调色 RGB 0,158,231） -->
  <circle cx="256" cy="412" r="9" fill="#009EE7"/>
  <!-- jwlab 出品方 maker's mark -->
  <text x="256" y="462" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic" fill="#C9A227" fill-opacity="0.82" text-anchor="middle" letter-spacing="4">jwlab</text>
</svg>
